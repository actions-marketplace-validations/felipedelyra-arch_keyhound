[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fresta"
version = "0.2.0"
description = "Detector de credenciais expostas em código, com regras para serviços brasileiros"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felipe Convento" }]
keywords = ["security", "secrets", "sast", "credentials", "brasil", "pix", "supabase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Natural Language :: Portuguese (Brazilian)",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/SEU-USUARIO/fresta"
Repository = "https://github.com/SEU-USUARIO/fresta"
Issues = "https://github.com/SEU-USUARIO/fresta/issues"

[project.scripts]
fresta = "fresta.cli:app"

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.packages.find]
where = ["core"]
include = ["fresta*"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]