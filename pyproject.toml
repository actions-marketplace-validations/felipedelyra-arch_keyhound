[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keyhound"
version = "0.2.0"
description = "Find exposed credentials in your code, with rules for Brazilian payment gateways and services"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Felipe Convento" }]
keywords = ["security", "secrets", "sast", "credentials", "brasil", "pix", "supabase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Natural Language :: Portuguese (Brazilian)",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/felipedelyra-arch/keyhound"
Repository = "https://github.com/felipedelyra-arch/keyhound"
Issues = "https://github.com/felipedelyra-arch/keyhound/issues"

[project.scripts]
keyhound = "keyhound.cli:app"

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.packages.find]
where = ["core"]
include = ["keyhound*"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]